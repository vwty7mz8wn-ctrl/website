<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ELUNEY 的小游戏集合。">
  <meta name="theme-color" content="#101112">
  <title>Games - ELUNEY</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8e9e7;
      --muted: #a2a5a4;
      --line: #383a3a;
      --paper: #101112;
      --panel: #171919;
      --panel-hover: #202222;
      --font-sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1120px, calc(100% - 64px)); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      border-bottom: 1px solid var(--line);
    }
    .wordmark, .back {
      font-family: var(--font-mono);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .wordmark { font-weight: 600; letter-spacing: .22em; }
    .back { color: var(--muted); }
    .back:hover { color: var(--ink); }
    main { min-height: calc(100dvh - 72px); padding: clamp(4.5rem, 10vw, 9rem) 0 4rem; }
    h1 {
      max-width: 7ch;
      margin: 0;
      font-size: clamp(3.4rem, 8vw, 7rem);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .88;
    }
    .intro { max-width: 26rem; margin: 1.75rem 0 4.5rem; color: var(--muted); line-height: 1.65; }
    .game-list { border-top: 1px solid var(--line); }
    .game-link {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.25rem;
      align-items: center;
      min-height: 144px;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-top: 0;
      background: var(--panel);
      transition: background-color 160ms ease, transform 160ms ease;
    }
    .game-link:hover { background: var(--panel-hover); }
    .game-link:active { transform: translateY(1px); }
    .game-link:focus-visible, .back:focus-visible, .wordmark:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .index, .kind, .arrow { color: var(--muted); font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
    .title { margin: 0; font-size: clamp(1.55rem, 3vw, 2.3rem); font-weight: 500; letter-spacing: -.05em; }
    .kind { display: block; margin-top: .45rem; }
    .arrow { font-size: 1.15rem; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 32px, 1120px); }
      header { height: 64px; }
      main { padding-top: 4rem; }
      .intro { margin-bottom: 3rem; }
      .game-link { min-height: 118px; padding: 1.25rem; }
    }
    @media (prefers-reduced-motion: reduce) { .game-link { transition: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="wordmark" href="/" aria-label="ELUNEY 首页">ELUNEY</a>
      <a class="back" href="/">返回首页</a>
    </header>

    <main>
      <h1>Games</h1>
      <p class="intro">一些可以随手打开、随时继续的小游戏。</p>
      <nav class="game-list" aria-label="小游戏列表">
        <a class="game-link" href="/games/snake/">
          <span class="index">01</span>
          <span>
            <span class="title">贪吃蛇</span>
            <span class="kind">Snake</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
