<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ELUNEY 的极简贪吃蛇小游戏。">
  <meta name="theme-color" content="#101112">
  <title>贪吃蛇 - ELUNEY</title>
  <style>
    :root { color-scheme: dark; --ink:#e8e9e7; --muted:#a2a5a4; --line:#383a3a; --paper:#101112; --panel:#171919; --panel-hover:#202222; --board:#0b0c0c; --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    * { box-sizing:border-box; }
    html { background:var(--paper); }
    body { min-width:320px; margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    body.modal-open { overflow:hidden; }
    button,input { font:inherit; border-radius:0; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1240px,calc(100% - 64px)); margin:0 auto; }
    .site-header { display:flex; align-items:center; justify-content:space-between; height:72px; border-bottom:1px solid var(--line); }
    .wordmark,.back,.label,.value,.hint,.touch-title,.footer-copy,.game-state,.control-label,.difficulty-button,.game-button { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; }
    .wordmark { font-weight:600; letter-spacing:.22em; }
    .back,.hint,.touch-title,.footer-copy,.label,.control-label { color:var(--muted); }
    .back:hover { color:var(--ink); }
    .wordmark:focus-visible,.back:focus-visible,.game-button:focus-visible,.direction:focus-visible,.difficulty-button:focus-visible,.dialog-button:focus-visible,.dialog-close:focus-visible,.code-input:focus-visible { outline:2px solid var(--ink); outline-offset:4px; }
    main { padding:clamp(3.5rem,7vw,6.5rem) 0 4rem; }
    .game-layout { display:grid; grid-template-columns:minmax(220px,.6fr) minmax(0,1.4fr); gap:clamp(2.5rem,7vw,8rem); align-items:start; }
    .intro { position:sticky; top:2rem; }
    h1 { margin:0; font-size:clamp(3.1rem,6.6vw,6.5rem); font-weight:500; letter-spacing:-.075em; line-height:.87; }
    .description { max-width:18rem; margin:1.6rem 0 0; color:var(--muted); font-size:1rem; line-height:1.65; }
    .hint { max-width:21rem; margin:3rem 0 0; line-height:1.65; }
    .play-area { min-width:0; }
    .scoreboard { display:grid; grid-template-columns:1fr 1fr auto; border:1px solid var(--line); border-bottom:0; }
    .stat { min-width:0; padding:.85rem 1rem; border-right:1px solid var(--line); }
    .label { display:block; margin-bottom:.25rem; }
    .value { display:block; color:var(--ink); font-size:1.3rem; font-weight:600; letter-spacing:.03em; }
    .action-group { display:grid; grid-template-columns:repeat(2,auto); }
    .game-button { min-width:82px; border:0; border-left:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; transition:background-color 160ms ease,transform 160ms ease; }
    .game-button:hover,.direction:hover,.difficulty-button:hover:not(:disabled) { background:var(--panel-hover); }
    .game-button:active,.direction:active,.difficulty-button:active:not(:disabled),.dialog-button:active,.dialog-close:active { transform:translateY(1px); }
    .game-button:disabled,.difficulty-button:disabled { color:#686b6a; cursor:not-allowed; }
    .game-state { display:flex; justify-content:space-between; gap:1rem; min-height:36px; margin:0; padding:.55rem 1rem; border:1px solid var(--line); border-bottom:0; color:var(--muted); }
    .mode-status[data-mode="cheat"] { color:var(--ink); }
    .game-controls { display:flex; align-items:center; justify-content:space-between; gap:1rem; min-height:58px; padding:.75rem 1rem; border:1px solid var(--line); border-bottom:0; background:var(--panel); }
    .difficulty-group { display:flex; align-items:center; gap:.7rem; }
    .difficulty-list { display:flex; }
    .difficulty-button { min-width:58px; height:30px; border:1px solid var(--line); border-right:0; background:transparent; color:var(--muted); cursor:pointer; }
    .difficulty-button:last-child { border-right:1px solid var(--line); }
    .difficulty-button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
    .board-wrap { position:relative; width:100%; border:1px solid var(--line); background:var(--board); touch-action:none; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:1; image-rendering:pixelated; }
    .message { position:absolute; inset:0; display:grid; place-items:center; padding:2rem; background:rgb(11 12 12 / .83); text-align:center; }
    .message[hidden],.pause-overlay[hidden],.game-over-stats[hidden] { display:none; }
    .message-copy { max-width:20rem; }
    .message-title { margin:0; font-size:clamp(1.7rem,4vw,2.8rem); font-weight:500; letter-spacing:-.055em; }
    .message-text { margin:.8rem 0 0; color:var(--muted); line-height:1.6; }
    .game-over-stats { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin:1.35rem auto 0; border:1px solid var(--line); background:var(--line); text-align:left; }
    .game-over-stat { min-width:92px; padding:.7rem .8rem; background:var(--panel); }
    .game-over-stat span { display:block; color:var(--muted); font-family:var(--mono); font-size:.61rem; letter-spacing:.1em; text-transform:uppercase; }
    .game-over-stat strong { display:block; margin-top:.25rem; font-family:var(--mono); font-size:.92rem; font-weight:500; letter-spacing:.05em; }
    .pause-overlay { position:absolute; top:1rem; left:1rem; z-index:2; padding:.65rem .75rem; border:1px solid var(--line); background:var(--panel); }
    .pause-overlay strong,.pause-overlay span { display:block; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    .pause-overlay strong { font-size:.78rem; }
    .pause-overlay span { margin-top:.35rem; color:var(--muted); font-size:.6rem; }
    .touch-controls { display:grid; justify-content:center; gap:.85rem; margin-top:1.5rem; }
    .touch-title { margin:0; text-align:center; }
    .direction-grid { display:grid; grid-template-columns:repeat(3,58px); gap:6px; }
    .direction { display:grid; width:58px; height:50px; place-items:center; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-family:var(--mono); font-size:1.2rem; transition:background-color 160ms ease,transform 160ms ease; -webkit-tap-highlight-color:transparent; }
    .direction.up { grid-column:2; }.direction.left { grid-column:1;grid-row:2; }.direction.down { grid-column:2;grid-row:2; }.direction.right { grid-column:3;grid-row:2; }
    .site-footer { display:flex; justify-content:space-between; gap:1rem; margin-top:5rem; padding:1.5rem 0 2rem; border-top:1px solid var(--line); }.footer-copy { margin:0; }
    .verification-modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:1.5rem; background:rgb(11 12 12 / .78); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
    .verification-modal[hidden] { display:none; }.verification-dialog { width:min(100%,430px); border:1px solid var(--ink); background:var(--panel); box-shadow:0 24px 64px rgb(0 0 0 / .32); }
    .dialog-header { display:flex; align-items:center; justify-content:space-between; min-height:52px; padding:0 1rem; border-bottom:1px solid var(--line); }
    .dialog-label,.code-label { margin:0; color:var(--muted); font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; }
    .dialog-close { padding:.35rem 0 .35rem .8rem; border:0; background:transparent; color:var(--muted); cursor:pointer; font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; }.dialog-close:hover { color:var(--ink); }
    .dialog-body { padding:1.5rem; }.dialog-title { margin:0; font-size:1.55rem; font-weight:500; letter-spacing:-.05em; }.dialog-copy { margin:.65rem 0 1.4rem; color:var(--muted); line-height:1.6; }.code-label { display:block; margin-bottom:.55rem; }
    .code-input { width:100%; height:46px; padding:0 .8rem; border:1px solid var(--line); background:var(--board); color:var(--ink); font-family:var(--mono); font-size:1rem; }.code-input::placeholder { color:#686b6a; }.code-input[aria-invalid="true"] { border-color:var(--ink); }
    .dialog-error { min-height:1.25rem; margin:.6rem 0 0; color:var(--muted); font-size:.85rem; }.dialog-actions { display:flex; justify-content:flex-end; margin-top:1.25rem; }.dialog-button { min-width:92px; min-height:42px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
    @media (min-width:761px) { .touch-controls { display:none; } }
    @media (max-width:760px) { .shell { width:min(100% - 32px,1240px); }.site-header { height:64px; }main { padding-top:3.5rem; }.game-layout { grid-template-columns:1fr; gap:2.6rem; }.intro { position:static; }.description { margin-top:1.25rem; }.hint { margin-top:1.5rem; }.stat { padding:.75rem; }.action-group { grid-template-columns:1fr; }.game-button { min-width:74px; min-height:38px; border-bottom:1px solid var(--line); }.game-button:last-child { border-bottom:0; }.game-controls { align-items:flex-start; flex-direction:column; }.difficulty-group { width:100%; justify-content:space-between; }.difficulty-list { flex:1; }.difficulty-button { flex:1; }.site-footer { margin-top:3.5rem; }.dialog-body { padding:1.25rem; } }
    @media (prefers-reduced-motion:reduce) { .game-button,.direction,.difficulty-button { transition:none; }.verification-modal { backdrop-filter:none; -webkit-backdrop-filter:none; } }
  </style>
</head>
<body>
  <div class="shell"><header class="site-header"><a class="wordmark" href="/" aria-label="ELUNEY 首页">ELUNEY</a><a class="back" href="/games/">游戏列表</a></header>
    <main><section class="game-layout" aria-labelledby="game-title"><div class="intro"><h1 id="game-title">贪吃蛇</h1><p class="description">保持节奏，别碰边界，也别撞到自己。</p><p class="hint">方向键 / WASD：移动<br>Space：暂停 / 继续<br>R：暂停或结束后重新开始<br>手机：方向键或滑动棋盘</p></div>
      <div class="play-area"><div class="scoreboard" aria-label="游戏分数"><div class="stat"><span class="label">当前分数</span><strong class="value" id="score">0</strong></div><div class="stat"><span class="label">最高分</span><strong class="value" id="best-score">0</strong></div><div class="action-group"><button class="game-button" id="pause-button" type="button" disabled>暂停</button><button class="game-button" id="restart-button" type="button">重新开始</button></div></div>
        <p class="game-state" role="status" aria-live="polite"><span class="mode-status" id="mode-status" data-mode="normal">Normal</span><span id="state-status">Ready</span></p>
        <div class="game-controls" aria-label="游戏设置"><div class="difficulty-group"><span class="control-label">难度</span><div class="difficulty-list" role="group" aria-label="选择难度"><button class="difficulty-button" type="button" data-difficulty="easy" aria-pressed="false">Easy</button><button class="difficulty-button" type="button" data-difficulty="normal" aria-pressed="true">Normal</button><button class="difficulty-button" type="button" data-difficulty="hard" aria-pressed="false">Hard</button></div></div></div>
        <div class="board-wrap" id="board-wrap"><canvas id="board" width="600" height="600" role="img" aria-label="贪吃蛇游戏区域"></canvas><div class="pause-overlay" id="pause-overlay" hidden><strong>Paused</strong><span>Space / 继续</span></div><div class="message" id="message"><div class="message-copy"><h2 class="message-title" id="message-title">准备开始</h2><p class="message-text" id="message-text">按方向键、WASD、触控方向键或滑动棋盘开始。</p><div class="game-over-stats" id="game-over-stats" hidden><div class="game-over-stat"><span>Score</span><strong id="final-score">0</strong></div><div class="game-over-stat"><span>Best</span><strong id="final-best">0</strong></div><div class="game-over-stat"><span>Length</span><strong id="final-length">3</strong></div><div class="game-over-stat"><span>Time</span><strong id="final-time">00:00</strong></div></div></div></div></div>
        <div class="touch-controls" aria-label="触控方向键"><p class="touch-title">方向控制</p><div class="direction-grid"><button class="direction up" type="button" data-direction="up" aria-label="向上">↑</button><button class="direction left" type="button" data-direction="left" aria-label="向左">←</button><button class="direction down" type="button" data-direction="down" aria-label="向下">↓</button><button class="direction right" type="button" data-direction="right" aria-label="向右">→</button></div></div>
      </div></section></main><footer class="site-footer"><p class="footer-copy">ELUNEY</p><p class="footer-copy">Snake</p></footer></div>
  <div class="verification-modal" id="verification-modal" hidden><section class="verification-dialog" role="dialog" aria-modal="true" aria-labelledby="verification-title" aria-describedby="verification-copy"><header class="dialog-header"><p class="dialog-label">Access check</p><button class="dialog-close" id="dialog-close" type="button">关闭</button></header><div class="dialog-body"><h2 class="dialog-title" id="verification-title">验证</h2><p class="dialog-copy" id="verification-copy">输入访问口令以继续。</p><form id="verification-form"><label class="code-label" for="code-input">口令</label><input class="code-input" id="code-input" name="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入内容"><p class="dialog-error" id="dialog-error" role="alert" aria-live="assertive"></p><div class="dialog-actions"><button class="dialog-button" type="submit">确认</button></div></form></div></section></div>
  <script>
    (() => {
      const State=Object.freeze({READY:'READY',RUNNING:'RUNNING',PAUSED:'PAUSED',GAME_OVER:'GAME_OVER',CHEAT_AUTH:'CHEAT_AUTH'}), grid=20, swipeMin=30;
      const difficultyConfig=Object.freeze({easy:{speed:160},normal:{speed:110},hard:{speed:75}}), directions=Object.freeze({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}});
      const keys=Object.freeze({ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}), konami=Object.freeze(['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a']);
      const canvas=document.querySelector('#board'), ctx=canvas.getContext('2d'), wrap=document.querySelector('#board-wrap'), scoreEl=document.querySelector('#score'), bestEl=document.querySelector('#best-score'), pauseBtn=document.querySelector('#pause-button'), restartBtn=document.querySelector('#restart-button'), modeEl=document.querySelector('#mode-status'), stateEl=document.querySelector('#state-status'), pauseOverlay=document.querySelector('#pause-overlay'), message=document.querySelector('#message'), messageTitle=document.querySelector('#message-title'), messageText=document.querySelector('#message-text'), overStats=document.querySelector('#game-over-stats'), finalScore=document.querySelector('#final-score'), finalBest=document.querySelector('#final-best'), finalLength=document.querySelector('#final-length'), finalTime=document.querySelector('#final-time'), diffButtons=[...document.querySelectorAll('[data-difficulty]')], dirButtons=[...document.querySelectorAll('[data-direction]')], modal=document.querySelector('#verification-modal'), form=document.querySelector('#verification-form'), codeInput=document.querySelector('#code-input'), errorEl=document.querySelector('#dialog-error'), closeBtn=document.querySelector('#dialog-close');
      let state=State.READY, mode='normal', difficulty='normal', snake=[], food, direction=directions.right, queued=directions.right, score=0, tickTimer, elapsed=0, clockAt=null, konamiBuffer=[], touchStart, previousFocus;
      const best=loadBestScores();
      function stored(key){try{const value=localStorage.getItem(key);if(value===null)return null;const number=Number.parseInt(value,10);return Number.isFinite(number)&&number>=0?number:0;}catch(error){return null;}}
      function save(key,value){try{localStorage.setItem(key,String(value));}catch(error){}}
      function loadBestScores(){const legacy=stored('eluney-snake-best'), normal=stored('normalBestScore');const scores={normal:normal===null?(legacy??0):normal,cheat:stored('cheatBestScore')??0};if(normal===null&&legacy!==null)save('normalBestScore',scores.normal);return scores;}
      function updateUI(){const labels={[State.READY]:'Ready',[State.RUNNING]:'Running',[State.PAUSED]:'Paused',[State.GAME_OVER]:'Game over',[State.CHEAT_AUTH]:'Auth'};modeEl.textContent=mode==='cheat'?'Cheat':'Normal';modeEl.dataset.mode=mode;stateEl.textContent=labels[state];scoreEl.textContent=score;bestEl.textContent=best[mode];pauseBtn.disabled=state!==State.RUNNING&&state!==State.PAUSED;pauseBtn.textContent=state===State.PAUSED?'继续':'暂停';pauseOverlay.hidden=state!==State.PAUSED;const locked=state===State.RUNNING||state===State.PAUSED||state===State.CHEAT_AUTH;diffButtons.forEach(button=>{button.disabled=locked;button.setAttribute('aria-pressed',String(button.dataset.difficulty===difficulty));});}
      function setState(next){state=next;updateUI();}
      function randomFood(){const spots=[];for(let y=0;y<grid;y+=1)for(let x=0;x<grid;x+=1)if(!snake.some(segment=>segment.x===x&&segment.y===y))spots.push({x,y});return spots[Math.floor(Math.random()*spots.length)];}
      function resetBoard(){stopTick();freezeClock();elapsed=0;clockAt=null;mode='normal';score=0;snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];direction=directions.right;queued=directions.right;food=randomFood();konamiBuffer=[];setState(State.READY);overStats.hidden=true;messageTitle.textContent='准备开始';messageText.textContent='按方向键、WASD、触控方向键或滑动棋盘开始。';message.hidden=false;render();}
      function stopTick(){window.clearTimeout(tickTimer);tickTimer=undefined;}
      function resumeClock(){if(clockAt===null)clockAt=performance.now();}
      function freezeClock(){if(clockAt!==null){elapsed+=performance.now()-clockAt;clockAt=null;}}
      function elapsedNow(){return elapsed+(clockAt===null?0:performance.now()-clockAt);}
      function timeText(ms){const seconds=Math.floor(ms/1000);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
      function schedule(){stopTick();tickTimer=window.setTimeout(tick,difficultyConfig[difficulty].speed);}
      function start(){if(state===State.READY){message.hidden=true;resumeClock();setState(State.RUNNING);schedule();}else if(state===State.PAUSED){konamiBuffer=[];resumeClock();setState(State.RUNNING);schedule();}}
      function pause(){if(state!==State.RUNNING)return;stopTick();freezeClock();konamiBuffer=[];setState(State.PAUSED);}
      function togglePause(){if(state===State.RUNNING)pause();else if(state===State.PAUSED)start();}
      function finish(){stopTick();freezeClock();konamiBuffer=[];if(score>best[mode]){best[mode]=score;save(mode==='cheat'?'cheatBestScore':'normalBestScore',score);}setState(State.GAME_OVER);messageTitle.textContent='本局结束';messageText.textContent=mode==='cheat'?'CHEAT':'按 R 或重新开始。';finalScore.textContent=score;finalBest.textContent=best[mode];finalLength.textContent=snake.length;finalTime.textContent=timeText(elapsedNow());overStats.hidden=false;message.hidden=false;render();}
      function tick(){if(state!==State.RUNNING)return;direction=queued;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y}, wall=head.x<0||head.x>=grid||head.y<0||head.y>=grid;if(mode==='cheat'&&wall){head.x=(head.x+grid)%grid;head.y=(head.y+grid)%grid;}const eats=food&&head.x===food.x&&head.y===food.y, body=eats?snake:snake.slice(0,-1), self=body.some(segment=>segment.x===head.x&&segment.y===head.y);if(mode==='normal'&&(wall||self)){finish();return;}snake.unshift(head);if(eats){score+=mode==='cheat'?2:1;food=randomFood();if(!food){finish();return;}}else snake.pop();updateUI();render();schedule();}
      function move(name){if(state!==State.READY&&state!==State.RUNNING)return;const next=directions[name];if(!next||next.x===-queued.x&&next.y===-queued.y)return;queued=next;if(state===State.READY)start();}
      function chooseDifficulty(next){if((state!==State.READY&&state!==State.GAME_OVER)||!difficultyConfig[next])return;difficulty=next;updateUI();}
      function drawKonamiKey(key){if(key.startsWith('Arrow'))return key;const lowered=key.toLowerCase();return lowered==='a'||lowered==='b'?lowered:null;}
      function recordKonami(key){const input=drawKonamiKey(key);if(!input){konamiBuffer=[];return false;}konamiBuffer.push(input);if(konamiBuffer.length>konami.length)konamiBuffer.shift();const match=konami.every((entry,index)=>konamiBuffer[index]===entry);if(match)konamiBuffer=[];return match;}
      function openAuth(){if(state!==State.PAUSED)return;previousFocus=document.activeElement;form.reset();errorEl.textContent='';codeInput.removeAttribute('aria-invalid');modal.hidden=false;document.body.classList.add('modal-open');setState(State.CHEAT_AUTH);window.requestAnimationFrame(()=>{codeInput.focus();codeInput.value='';});}
      function closeAuth(){if(state!==State.CHEAT_AUTH)return;modal.hidden=true;document.body.classList.remove('modal-open');errorEl.textContent='';codeInput.removeAttribute('aria-invalid');setState(State.PAUSED);if(previousFocus instanceof HTMLElement)previousFocus.focus();}
      function enableCheat(){mode='cheat';closeAuth();}
      function render(){const cell=canvas.width/grid;ctx.fillStyle='#0b0c0c';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#171919';ctx.lineWidth=1;for(let index=1;index<grid;index+=1){const position=Math.round(index*cell)+.5;ctx.beginPath();ctx.moveTo(position,0);ctx.lineTo(position,canvas.height);ctx.moveTo(0,position);ctx.lineTo(canvas.width,position);ctx.stroke();}if(food){ctx.fillStyle='#8d9190';ctx.fillRect(food.x*cell+4,food.y*cell+4,cell-8,cell-8);}snake.forEach((segment,index)=>{ctx.fillStyle=index===0?'#e8e9e7':'#c8cac8';ctx.fillRect(segment.x*cell+2,segment.y*cell+2,cell-4,cell-4);});}
      document.addEventListener('keydown',event=>{if(state===State.CHEAT_AUTH){if(event.key==='Escape'){event.preventDefault();closeAuth();}return;}if(event.code==='Space'){event.preventDefault();togglePause();return;}if((event.key==='r'||event.key==='R')&&(state===State.PAUSED||state===State.GAME_OVER)){event.preventDefault();resetBoard();return;}if(state===State.PAUSED){if(drawKonamiKey(event.key))event.preventDefault();if(recordKonami(event.key))openAuth();return;}if(state!==State.READY&&state!==State.RUNNING)return;const name=keys[event.key];if(!name)return;event.preventDefault();move(name);});
      dirButtons.forEach(button=>button.addEventListener('click',()=>move(button.dataset.direction)));diffButtons.forEach(button=>button.addEventListener('click',()=>chooseDifficulty(button.dataset.difficulty)));pauseBtn.addEventListener('click',togglePause);restartBtn.addEventListener('click',resetBoard);closeBtn.addEventListener('click',closeAuth);form.addEventListener('submit',event=>{event.preventDefault();if(codeInput.value.trim().toLowerCase()==='mario'){enableCheat();return;}codeInput.setAttribute('aria-invalid','true');errorEl.textContent='口令不正确，请重试。';codeInput.select();});
      wrap.addEventListener('touchstart',event=>{if(event.touches.length!==1)return;const touch=event.touches[0];touchStart={x:touch.clientX,y:touch.clientY};event.preventDefault();},{passive:false});wrap.addEventListener('touchmove',event=>{if(touchStart)event.preventDefault();},{passive:false});wrap.addEventListener('touchend',event=>{if(!touchStart)return;const touch=event.changedTouches[0],dx=touch.clientX-touchStart.x,dy=touch.clientY-touchStart.y;touchStart=undefined;if(Math.max(Math.abs(dx),Math.abs(dy))<swipeMin)return;event.preventDefault();move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));},{passive:false});wrap.addEventListener('touchcancel',()=>{touchStart=undefined;});
      resetBoard();
    })();
  </script>
