<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ELUNEY - 产品、模型、工具与项目。">
  <meta name="theme-color" content="#101112">
  <title>ELUNEY</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8e9e7;
      --muted: #a2a5a4;
      --line: #383a3a;
      --paper: #101112;
      --panel: #171919;
      --panel-hover: #202222;
      --font-sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }

    .site-shell {
      width: min(1440px, calc(100% - 64px));
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
    }

    .header-note,
    .eyebrow,
    .entry-index,
    .footer-copy {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.67rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(360px, 1.05fr);
      gap: clamp(3rem, 8vw, 9rem);
      align-items: end;
      min-height: calc(100dvh - 72px);
      padding: 6rem 0 4rem;
    }

    .hero-copy { padding-bottom: 1.15rem; }

    .eyebrow { margin: 0 0 1.5rem; }

    h1 {
      max-width: 8ch;
      margin: 0;
      font-size: clamp(4.15rem, 10vw, 9rem);
      font-weight: 500;
      letter-spacing: -0.075em;
      line-height: 0.84;
    }

    .intro {
      max-width: 23rem;
      margin: 2.25rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      line-height: 1.65;
    }

    .hero-figure { margin: 0; }

    .hero-figure img {
      display: block;
      width: 100%;
      min-height: 490px;
      height: min(62vw, 680px);
      object-fit: cover;
      filter: grayscale(100%) contrast(1.05);
    }

    .entry-section { padding: 5rem 0 2rem; }

    .section-heading {
      margin: 0 0 1.7rem;
      font-size: clamp(1.55rem, 2.5vw, 2.6rem);
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .entry-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .entry {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.25rem;
      align-items: center;
      min-height: 156px;
      padding: 1.5rem;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      transition: background-color 180ms ease, color 180ms ease;
    }

    .entry:hover { background: var(--panel-hover); }
    .entry:active { transform: translateY(1px); }
    .entry:focus-visible { outline: 2px solid var(--ink); outline-offset: -5px; }

    .entry-index { align-self: start; }

    .entry-title {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .entry-arrow {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      transition: transform 180ms ease;
    }

    .entry:hover .entry-arrow { transform: translate(3px, -3px); }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 7rem;
      padding: 1.5rem 0 2rem;
      border-top: 1px solid var(--line);
    }

    .footer-copy { margin: 0; }

    @media (max-width: 760px) {
      .site-shell { width: min(100% - 32px, 1440px); }

      .site-header { height: 64px; }
      .header-note { font-size: 0.58rem; }

      .hero {
        grid-template-columns: 1fr;
        gap: 3rem;
        min-height: auto;
        padding: 4.5rem 0 1.5rem;
      }

      .hero-copy { padding: 0; }
      h1 { font-size: clamp(3.9rem, 21vw, 6.6rem); }
      .intro { margin-top: 1.75rem; }

      .hero-figure img {
        min-height: 0;
        height: 70vw;
      }

      .entry-section { padding-top: 4.5rem; }
      .entry-grid { grid-template-columns: 1fr; }
      .entry { min-height: 116px; padding: 1.25rem; }
      .site-footer { margin-top: 4.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .entry, .entry-arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="ELUNEY 首页">ELUNEY</a>
      <span class="header-note">Independent works</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Objects, systems, studies</p>
          <h1 id="page-title">ELUNEY</h1>
          <p class="intro">以清晰的结构，记录产品、模型、工具与正在发生的项目。</p>
        </div>
        <figure class="hero-figure">
          <img src="assets/eluney-material-study.png" alt="深色空间中的铝板、玻璃与金属构件">
        </figure>
      </section>

      <section class="entry-section" aria-labelledby="entry-heading">
        <h2 class="section-heading" id="entry-heading">索引</h2>
        <nav class="entry-grid" aria-label="ELUNEY 内容入口">
          <a class="entry" href="/products/">
            <span class="entry-index">01</span>
            <h3 class="entry-title">产品展示</h3>
            <span class="entry-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="entry" href="/3d/">
            <span class="entry-index">02</span>
            <h3 class="entry-title">3D 模型</h3>
            <span class="entry-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="entry" href="/tools/">
            <span class="entry-index">03</span>
            <h3 class="entry-title">工具</h3>
            <span class="entry-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="entry" href="/projects/">
            <span class="entry-index">04</span>
            <h3 class="entry-title">项目</h3>
            <span class="entry-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="entry" href="/games/snake/">
            <span class="entry-index">05</span>
            <h3 class="entry-title">贪吃蛇 / Snake</h3>
            <span class="entry-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-copy">ELUNEY</p>
      <p class="footer-copy">© 2026</p>
    </footer>
  </div>
</body>
</html>
